<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X-Gaussian · Interactive X-ray</title><link rel="stylesheet" href="viewer.css?v=2"><script type="module" src="load-viewer.js?v=3"></script></head><body>
<div hidden><select id="scene"></select><select id="quality"><option value="preview">Preview</option><option value="native">Native</option></select><div id="detail-control"></div><span id="resolution"></span><a id="field-download"></a><span id="title"></span><input id="exposure"><span id="exposure-value"></span><input id="contrast"><span id="contrast-value"></span><input id="structure"><span id="structure-value"></span><input type="checkbox" id="invert"><input type="checkbox" id="cool"><button id="download"></button></div>
